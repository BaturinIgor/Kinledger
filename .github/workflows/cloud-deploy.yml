name: Deploy cloud (Supabase)

# Run from the Actions tab after the repository secrets below are set.
# It applies the database migrations, stores the Apple key for account deletion
# and deploys the delete-account function. Safe to run again: applied migrations are skipped.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF   the id in the project URL: https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   APPLE_TEAM_ID          developer.apple.com → Membership
#   APPLE_KEY_ID           the "Sign in with Apple" key id
#   APPLE_PRIVATE_KEY      contents of AuthKey_<id>.p8

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Store the Apple key for account deletion
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_KEY_ID" ]; then echo "Apple key not set yet, skipping"; exit 0; fi
          supabase secrets set --project-ref "$PROJECT_REF" \
            APPLE_TEAM_ID="$APPLE_TEAM_ID" APPLE_KEY_ID="$APPLE_KEY_ID" \
            APPLE_CLIENT_ID=app.kinledger APPLE_PRIVATE_KEY="$APPLE_PRIVATE_KEY"

      - name: Deploy the delete-account function
        run: supabase functions deploy delete-account --project-ref "$PROJECT_REF"
