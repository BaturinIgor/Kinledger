# Xcode project spec. Generate the project with: xcodegen generate
name: Kinledger
options:
  bundleIdPrefix: app.kinledger
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Kinledger:
    type: application
    platform: iOS
    sources: [Kinledger]
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kinledger
        CODE_SIGN_ENTITLEMENTS: Kinledger/Kinledger.entitlements
        DEVELOPMENT_TEAM: 46V47ZSX5V
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kinledger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Kinledger uses the camera to photograph receipts.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  KinledgerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KinledgerTests]
    dependencies:
      - target: Kinledger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kinledger.tests
schemes:
  Kinledger:
    build:
      targets:
        Kinledger: all
    run:
      storeKitConfiguration: StoreKit/Kinledger.storekit
    test:
      targets: [KinledgerTests]
